<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Hologram Logo Spinner & Video Exporter</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #06080d;
            color: #ffffff;
            padding: 20px;
            overflow-x: hidden;
        }

        .studio-container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .back-btn {
            color: #ffb700;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 700;
            padding: 8px 16px;
            border: 1px solid rgba(255, 183, 0, 0.4);
            border-radius: 20px;
            background: rgba(0,0,0,0.5);
        }

        .studio-title {
            color: #00ffcc;
            font-size: 1.3rem;
            font-weight: 800;
            letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(0, 255, 204, 0.5);
        }

        .editor-grid {
            display: grid;
            grid-template-columns: 1.3fr 1fr;
            gap: 20px;
            background: rgba(13, 17, 23, 0.9);
            border: 1px solid rgba(0, 255, 204, 0.3);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
        }

        /* 3D Holographic Canvas Stage */
        .stage-wrapper {
            width: 100%;
            height: 480px;
            background: radial-gradient(circle, #001220 0%, #000000 100%);
            border: 1.5px dashed rgba(0, 243, 255, 0.4);
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
            cursor: pointer;
        }

        canvas#holoCanvas {
            width: 100%;
            height: 100%;
            display: block;
            z-index: 2;
        }

        .upload-placeholder {
            position: absolute;
            z-index: 3;
            text-align: center;
            pointer-events: none;
        }

        .holo-badges {
            position: absolute;
            top: 15px; left: 15px;
            z-index: 6;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .badge {
            font-size: 0.65rem;
            font-weight: 700;
            color: #00ffcc;
            background: rgba(0, 15, 25, 0.85);
            border: 1px solid rgba(0, 255, 204, 0.4);
            padding: 4px 10px;
            border-radius: 4px;
            letter-spacing: 1px;
        }

        /* Controls */
        .tools-panel {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .panel-section {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(0, 255, 204, 0.2);
            padding: 15px;
            border-radius: 10px;
        }

        .section-title {
            font-size: 0.85rem;
            color: #00ffcc;
            margin-bottom: 12px;
            font-weight: 700;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
            margin-bottom: 12px;
        }

        .control-label {
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            color: #ddd;
        }

        .slider {
            width: 100%;
            accent-color: #00ffcc;
            cursor: pointer;
        }

        .btn-stack {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 10px;
        }

        .action-btn {
            width: 100%;
            padding: 13px;
            background: #00ffcc;
            border: none;
            color: #000;
            font-size: 0.85rem;
            font-weight: 800;
            letter-spacing: 1px;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.4);
            transition: all 0.3s ease;
        }

        .action-btn:hover { box-shadow: 0 0 25px rgba(0, 255, 204, 0.7); }

        .record-btn {
            background: #ff0055;
            color: #fff;
            box-shadow: 0 0 15px rgba(255, 0, 85, 0.4);
        }

        .record-btn:hover { box-shadow: 0 0 25px rgba(255, 0, 85, 0.7); }

        @media (max-width: 900px) {
            .editor-grid { grid-template-columns: 1fr; }
            .stage-wrapper { height: 350px; }
        }
    </style>
</head>
<body>

    <div class="studio-container">
        <div class="header-bar">
            <a href="index.html" class="back-btn">← DASHBOARD</a>
            <h2 class="studio-title">🌀 3D HOLOGRAM LOGO SPINNER & VIDEO GENERATOR</h2>
        </div>

        <div class="editor-grid">
            
            <!-- 3D Hologram Render Stage -->
            <div class="stage-wrapper" onclick="document.getElementById('logoInput').click()">
                <canvas id="holoCanvas" width="600" height="480"></canvas>

                <div class="upload-placeholder" id="uploadPlaceholder">
                    <p style="font-size: 0.9rem; font-weight: 700; color: #fff;">🔮 Upload Logo Image</p>
                    <p style="font-size: 0.75rem; color: #00ffcc; margin-top: 4px;">PNG / JPG ഫയൽ തിരഞ്ഞടുക്കുക</p>
                </div>

                <div class="holo-badges">
                    <span class="badge" id="statusBadge">STATUS: WAITING FOR LOGO</span>
                    <span class="badge" id="recBadge" style="display:none; color:#ff0055; border-color:#ff0055;">🔴 RECORDING VIDEO...</span>
                </div>

                <input type="file" id="logoInput" accept="image/*" style="display: none;">
            </div>

            <!-- Controls Panel -->
            <div class="tools-panel">
                
                <div class="panel-section">
                    <div class="section-title">⚙️ 3D Rotation & Hologram Settings</div>

                    <div class="control-group">
                        <div class="control-label"><span>Rotation Speed (കറക്കത്തിന്റെ വേഗത)</span><span id="v-speed">Speed: 2</span></div>
                        <input type="range" class="slider" id="spinSpeed" min="1" max="10" value="2">
                    </div>

                    <div class="control-group">
                        <div class="control-label"><span>Hologram Glow (നിയോൺ വെളിച്ചം)</span><span id="v-glow">20px</span></div>
                        <input type="range" class="slider" id="holoGlow" min="5" max="50" value="20">
                    </div>

                    <div class="control-group">
                        <div class="control-label"><span>Scanline Transparency</span><span id="v-opac">80%</span></div>
                        <input type="range" class="slider" id="holoOpac" min="30" max="100" value="80">
                    </div>
                </div>

                <!-- Export Video Controls -->
                <div class="btn-stack">
                    <button class="action-btn record-btn" id="recordBtn" onclick="renderAndRecordVideo()">📹 RECORD & DOWNLOAD HOLOGRAM VIDEO</button>
                </div>

            </div>

        </div>
    </div>

    <script>
        const logoInput = document.getElementById('logoInput');
        const canvas = document.getElementById('holoCanvas');
        const ctx = canvas.getContext('2d');
        const uploadPlaceholder = document.getElementById('uploadPlaceholder');
        const statusBadge = document.getElementById('statusBadge');
        const recBadge = document.getElementById('recBadge');

        let loadedImage = null;
        let rotationAngle = 0;
        let isAnimating = false;

        // Sliders
        const spinSpeed = document.getElementById('spinSpeed');
        const holoGlow = document.getElementById('holoGlow');
        const holoOpac = document.getElementById('holoOpac');

        logoInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.onload = function() {
                    loadedImage = img;
                    uploadPlaceholder.style.display = 'none';
                    statusBadge.innerText = 'STATUS: 3D HOLOGRAM ACTIVE';
                    if (!isAnimating) {
                        isAnimating = true;
                        animateHologram();
                    }
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        });

        // 3D Rotation Animation Loop
        function animateHologram() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw Hologram Floor Grid
            drawGridFloor();

            if (loadedImage) {
                const speed = parseFloat(spinSpeed.value) * 0.02;
                const glow = holoGlow.value;
                const opacity = holoOpac.value / 100;

                rotationAngle += speed;

                ctx.save();
                ctx.translate(canvas.width / 2, canvas.height / 2 - 20);

                // Simulate 3D Y-Axis Scale Rotation
                const scaleX = Math.cos(rotationAngle);
                ctx.scale(scaleX, 1);

                // Cyan Holographic Glow Effect
                ctx.shadowColor = '#00ffcc';
                ctx.shadowBlur = glow;
                ctx.globalAlpha = opacity;

                const imgWidth = 180;
                const imgHeight = (loadedImage.height / loadedImage.width) * imgWidth;

                ctx.drawImage(loadedImage, -imgWidth / 2, -imgHeight / 2, imgWidth, imgHeight);
                ctx.restore();

                // Hologram Laser Scanline Overlay
                drawScanlines();
            }

            requestAnimationFrame(animateHologram);
        }

        // Draw 3D Grid Floor
        function drawGridFloor() {
            ctx.save();
            ctx.strokeStyle = 'rgba(0, 255, 204, 0.15)';
            ctx.lineWidth = 1;

            const startY = canvas.height - 100;
            for (let i = -canvas.width; i < canvas.width * 2; i += 30) {
                ctx.beginPath();
                ctx.moveTo(canvas.width / 2, startY - 80);
                ctx.lineTo(i, canvas.height);
                ctx.stroke();
            }

            for (let y = startY - 80; y < canvas.height; y += 15) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(canvas.width, y);
                ctx.stroke();
            }
            ctx.restore();
        }

        // Scanlines Overlay Effect
        function drawScanlines() {
            ctx.save();
            ctx.fillStyle = 'rgba(0, 255, 204, 0.04)';
            for (let i = 0; i < canvas.height; i += 4) {
                ctx.fillRect(0, i, canvas.width, 2);
            }
            ctx.restore();
        }

        // Record 3D Animation and Export Video
        function renderAndRecordVideo() {
            if (!loadedImage) {
                alert('ദയവായി റെക്കോർഡ് ചെയ്യുന്നതിന് മുമ്പ് ഒരു ലോഗോ അപ്‌ലോഡ് ചെയ്യുക!');
                return;
            }

            const stream = canvas.captureStream(60); // 60 FPS Video Stream
            const mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm' });
            const chunks = [];

            mediaRecorder.ondataavailable = (e) => chunks.push(e.data);
            mediaRecorder.onstop = () => {
                const blob = new Blob(chunks, { type: 'video/webm' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'NewDezire_3D_Hologram_Logo.webm';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);

                recBadge.style.display = 'none';
                alert('3D ഹോളോഗ്രാം വീഡിയോ വിജയകരമായി റെക്കോർഡ് ചെയ്തു ડൗൺലോഡ് ആയിട്ടുണ്ട്!');
            };

            mediaRecorder.start();
            recBadge.style.display = 'inline-block';

            // Automatically record for 5 Seconds (Full 360 Rotation)
            setTimeout(() => {
                mediaRecorder.stop();
            }, 5000);
        }
    </script>
</body>
</html>
