<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexura.AI - Next-Gen Creator Ecosystem</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body, html {
            width: 100%; min-height: 100vh;
            font-family: 'Courier New', Courier, monospace;
            /* ഇവിടെയാണ് നമ്മൾ അപ്ലോഡ് ചെയ്ത bg.jpg ബാക്ക്ഗ്രൗണ്ട് ആയി വരുന്നത് */
            background: #08090b url('bg.jpg') center top/cover no-repeat fixed;
            color: #e0e0e0; overflow-x: hidden;
        }

        .main-container {
            display: flex; flex-direction: column; align-items: center;
            min-height: 100vh; padding: 15px;
        }

        /* Header */
        header {
            width: 100%; max-width: 1100px; display: flex;
            justify-content: space-between; align-items: center;
            padding: 10px 0; margin-bottom: 20px;
        }
        .header-logo { font-size: 0.9em; color: #ffb700; letter-spacing: 2px; font-weight: bold; }
        .status-container { font-size: 0.6em; color: #ffb700; letter-spacing: 1px; display: flex; gap: 5px; align-items: center;}
        .status-dot { width: 5px; height: 5px; background-color: #ffb700; border-radius: 50%; box-shadow: 0 0 8px #ffb700; }

        /* ഈ സ്പേസ് ബാക്ക്ഗ്രൗണ്ടിലെ 3D ലോഗോ കാണാൻ വേണ്ടിയുള്ളതാണ് */
        .logo-spacer {
            width: 100%;
            height: 380px; /* നിങ്ങളുടെ ഫോട്ടോയിലെ ലോഗോയുടെ വലിപ്പം അനുസരിച്ച് ഇത് മാറ്റാം */
        }

        /* 3 Cards Section */
        .module-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px; width: 100%; max-width: 1100px;
        }

        .module-card {
            background: rgba(12, 14, 20, 0.7);
            border: 1px solid rgba(255, 183, 0, 0.4);
            border-radius: 12px; padding: 20px 10px;
            backdrop-filter: blur(8px);
            min-height: 180px; position: relative;
            display: flex; flex-direction: column; align-items: center;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        .card-dots { position: absolute; top: 10px; right: 10px; display: flex; gap: 3px; }
        .card-dot { width: 4px; height: 4px; background-color: #ffb700; border-radius: 50%; }

        .module-title {
            font-size: 0.75em; color: #e0e0e0;
            letter-spacing: 1px; margin-bottom: 25px;
            line-height: 1.4;
        }

        /* Loading Spinner */
        .spinner-container {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            gap: 15px; margin-top: auto; margin-bottom: 15px;
        }
        .spinner {
            width: 25px; height: 25px;
            border: 3px dotted rgba(255, 183, 0, 0.3);
            border-top: 3px solid #ffb700;
            border-radius: 50%;
            animation: spin 1.2s linear infinite;
        }
        .status-text { font-size: 0.6em; color: #ffb700; letter-spacing: 1px; font-weight: bold;}
        .locked-text { font-size: 0.7em; color: #555; margin-top: auto; margin-bottom: 20px;}

        @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="main-container">
        <!-- Header -->
        <header>
            <div class="header-logo">NEXURA.AI</div>
            <div class="status-container"><div class="status-dot"></div>CORE STATUS: ONLINE</div>
        </header>

        <!-- Empty Space to show the background image's 3D logo -->
        <div class="logo-spacer"></div>

        <!-- The 3 Cards -->
        <div class="module-grid">
            <!-- Card 1 -->
            <div class="module-card">
                <div class="card-dots"><div class="card-dot"></div><div class="card-dot"></div><div class="card-dot"></div></div>
                <div class="module-title">01. AI Voice<br>Studio</div>
                <div class="spinner-container">
                    <div class="spinner"></div>
                    <div class="status-text">MODULE INITIALIZING</div>
                </div>
            </div>

            <!-- Card 2 -->
            <div class="module-card">
                <div class="card-dots"><div class="card-dot"></div><div class="card-dot"></div><div class="card-dot"></div></div>
                <div class="module-title">02. AI Image<br>Studio</div>
            </div>

            <!-- Card 3 -->
            <div class="module-card">
                <div class="card-dots"><div class="card-dot"></div><div class="card-dot"></div><div class="card-dot"></div></div>
                <div class="module-title">03. Neural Video<br>Lab</div>
                <div class="locked-text">LOCKED</div>
            </div>
        </div>
    </div>
</body>
</html>
