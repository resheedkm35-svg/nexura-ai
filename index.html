<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexura.AI - Ecosystem Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Top Navigation Header -->
    <header class="main-header">
        <div class="brand-badge">NEXURA.AI</div>
        <div class="system-status">
            <span class="pulse-dot"></span>
            SYSTEM ONLINE
        </div>
    </header>

    <!-- Main Container -->
    <main class="dashboard-container">
        
        <!-- Center Hero / Logo Focal Point -->
        <div class="hero-spacer">
            <div class="hero-glow"></div>
        </div>

        <!-- 3 Core Module Cards Grid -->
        <div class="card-grid">
            
            <!-- Card 1: AI Voice & Audio -->
            <div class="card">
                <div class="card-header">
                    <span class="card-num">01</span>
                    <div class="status-indicator">READY</div>
                </div>
                <h3 class="card-title">AI Voice & Audio</h3>
                <p class="card-desc">Voice generation, background music & audio processing studio.</p>
                <div class="card-footer">
                    <button class="launch-btn">EXPLORE MODULE</button>
                </div>
            </div>

            <!-- Card 2: AI Image & Background -->
            <div class="card">
                <div class="card-header">
                    <span class="card-num">02</span>
                    <div class="status-indicator">READY</div>
                </div>
                <h3 class="card-title">Image Studio</h3>
                <p class="card-desc">Automatic background removal, graphic editing & asset tools.</p>
                <div class="card-footer">
                    <button class="launch-btn">EXPLORE MODULE</button>
                </div>
            </div>

            <!-- Card 3: Neural Video Lab -->
            <div class="card">
                <div class="card-header">
                    <span class="card-num">03</span>
                    <div class="status-indicator lock">LOCKED</div>
                </div>
                <h3 class="card-title">Video Lab</h3>
                <p class="card-desc">Cinematic video framing, AI generation & timeline rendering.</p>
                <div class="card-footer">
                    <button class="launch-btn disabled" disabled>COMING SOON</button>
                </div>
            </div>

        </div>
    </main>

</body>
</html>
