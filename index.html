<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexura.AI - Next-Gen Creator Ecosystem</title>
    <!-- CSS ഫയൽ ലിങ്ക് ചെയ്തിരിക്കുന്നു -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header -->
    <header>
        <div class="header-logo">NEXURA.AI</div>
        <div class="status-container">
            <div class="status-dot"></div>CORE STATUS: ONLINE
        </div>
    </header>

    <!-- 1. ലോഗോയും ആനിമേഷനും -->
    <div class="logo-container">
        <img src="bg.jpg" alt="NXA Logo" class="animated-logo" id="logo">
        <div class="brand-name">NEXURA.AI</div>
    </div>

    <!-- 2. ഇമേജ് ബാക്ക്ഗ്രൗണ്ട് റിമൂവൽ സെക്ഷൻ -->
    <div class="section">
        <h2 class="section-title">ഇമേജ് ബാക്ക്ഗ്രൗണ്ട് റിമൂവൽ</h2>
        <label for="image-upload" class="upload-btn">ഇമേജ് അപ്‌ലോഡ് ചെയ്യുക</label>
        <input type="file" id="image-upload" accept="image/*">
        <button id="remove-bg-btn" disabled>ബാക്ക്ഗ്രൗണ്ട് റിമൂവ് ചെയ്യുക</button>
        <p id="status-message"></p>
        <img src="" alt="Image Preview" class="image-preview" id="image-preview">
        <img src="" alt="Processed Image" class="image-preview" id="processed-image">
    </div>

    <!-- 3. വോയിസ് (ടെക്സ്റ്റ്-ടു-സ്പീച്ച്) സെക്ഷൻ -->
    <div class="section">
        <h2 class="section-title">AI വോയിസ് ജനറേഷൻ</h2>
        <textarea id="voice-text" placeholder="ഇവിടെ ടെക്സ്റ്റ് ടൈപ്പ് ചെയ്യുക..."></textarea>
        <button id="speak-btn">സംസാരിക്കുക</button>
    </div>

    <!-- JavaScript ഫയൽ ലിങ്ക് ചെയ്തിരിക്കുന്നു -->
    <script src="script.js"></script>
</body>
</html>
